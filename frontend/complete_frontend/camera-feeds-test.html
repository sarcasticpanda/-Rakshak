<!DOCTYPE html>
<html>
<head>
    <title>Camera Feeds Test</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff88;
            font-family: monospace;
            padding: 20px;
        }
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .camera-feed {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
        }
        .camera-feed h3 {
            color: #00ffcc;
            margin-top: 0;
        }
        .camera-feed img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            background: #000;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 5px;
        }
        .status {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .online { background: #00ff88; color: #000; }
        .offline { background: #ff3333; color: #fff; }
    </style>
</head>
<body>
    <h1>🎥 Live Camera Feeds Test</h1>
    <button onclick="loadFeeds()" style="background: #00ff88; color: #000; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🔄 Reload Feeds</button>
    
    <div id="camera-grid" class="camera-grid">
        <p>Loading cameras...</p>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function loadFeeds() {
            const grid = document.getElementById('camera-grid');
            
            try {
                // Fetch cameras from backend
                const response = await fetch(`${API_BASE}/cameras`);
                const cameras = await response.json();
                
                console.log('Loaded cameras:', cameras);
                
                // Clear grid
                grid.innerHTML = '';
                
                // Create feed for each camera
                cameras.forEach(camera => {
                    const feedDiv = document.createElement('div');
                    feedDiv.className = 'camera-feed';
                    
                    feedDiv.innerHTML = `
                        <h3>${camera.name}</h3>
                        <span class="status ${camera.status === 'running' ? 'online' : 'offline'}">${camera.status}</span>
                        <p style="color: #888;">📍 ${camera.location}</p>
                        <img src="${API_BASE}/stream/${camera.camera_id}" alt="${camera.name}">
                        <div class="stats">
                            <span>ID: ${camera.camera_id}</span>
                            <span>Status: ${camera.status}</span>
                        </div>
                    `;
                    
                    grid.appendChild(feedDiv);
                });
                
                console.log(`✅ Loaded ${cameras.length} camera feeds`);
                
            } catch (error) {
                console.error('Error loading feeds:', error);
                grid.innerHTML = `<p style="color: #ff3333;">Error: ${error.message}</p>`;
            }
        }

        // Auto-load on page load
        window.addEventListener('load', loadFeeds);
    </script>
</body>
</html>
